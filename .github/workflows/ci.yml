name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments never overlap: a later push waits for the earlier one to finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # Lint (ESLint, Prettier, TypeScript), every test, and the build, on the production Node.js
    # with a real MariaDB (production's engine) for the API and database tests.
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:11.4
        env:
          # Not UTC on purpose (like shared hosting): proves timestamps stay in UTC.
          TZ: Asia/Karachi
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ncg_pharmacy_test
          MARIADB_USER: ncg
          MARIADB_PASSWORD: ncg_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Wiped on every run; database tests refuse to be skipped in CI.
      TEST_DATABASE_URL: mysql://ncg:ncg_password@127.0.0.1:3306/ncg_pharmacy_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    # Only a push to main (or a manual run of main) reaches production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Build and assemble the release
        # Production package.json + lockfile, client/dist, server/dist, migrations, seed images,
        # compiled @ncg/shared and deploy/activate.sh (see scripts/package.mjs).
        run: |
          npm ci
          npm run build
          node scripts/package.mjs build/release

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload the release
        # .env, node_modules (CloudLinux venv link), tmp and logs live on the host and are never touched.
        run: |
          rsync -az --delete \
            --exclude=/.env --exclude=/node_modules --exclude=/tmp --exclude=/stderr.log \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            build/release/ "$DEPLOY_USER@$DEPLOY_HOST:ncg-app/"

      - name: Install dependencies, migrate, and restart
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash ncg-app/deploy/activate.sh 24'

      - name: Check the site answers
        # /api/health is 200 only when the app is up AND the database answers.
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/health" || true)
            echo "attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          exit 1
