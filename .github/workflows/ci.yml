name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Same engine as production (Namecheap cPanel runs MariaDB 11.4).
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: ncg_pharmacy_test
          MARIADB_USER: ncg
          MARIADB_PASSWORD: ncg_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      # API/DB tests run against this throwaway database (wiped on every run).
      TEST_DATABASE_URL: mysql://ncg:ncg_password@127.0.0.1:3306/ncg_pharmacy_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (ESLint, Prettier, TypeScript)
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
