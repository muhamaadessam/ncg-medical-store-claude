name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments never overlap: a later push waits for the earlier one to finish.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # cPanel > Setup Node.js App: application root and Node.js major version of the live app.
  APP_DIR: ncg-app
  NODE_MAJOR: 24

jobs:
  web:
    # Lint (ESLint, Prettier, TypeScript), shared + client tests and the build, on the project's
    # minimum Node.js (20) and on the version production runs (24).
    name: web (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check the deploy scripts
        # shellcheck is preinstalled on GitHub's Ubuntu runners. The test sources a fake CloudLinux
        # activate script that reads unset variables, like the real one does on the server.
        run: |
          shellcheck scripts/deploy/*.sh
          bash scripts/deploy/test-activate.sh
      - run: npm test -w shared
      - run: npm test -w client
      - run: npm run build

  api:
    # API and database tests against real disposable databases: MariaDB 11.4 (what production
    # runs) and MySQL 8.4.
    name: api (${{ matrix.database.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: MariaDB 11.4
            image: mariadb:11.4
            health: healthcheck.sh --connect --innodb_initialized
          - name: MySQL 8.4
            image: mysql:8.4
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
    services:
      db:
        image: ${{ matrix.database.image }}
        env:
          # Both images accept the MYSQL_* variables.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ncg_pharmacy_test
          MYSQL_USER: ncg
          MYSQL_PASSWORD: ncg_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.database.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # Wiped on every run; database tests refuse to be skipped in CI.
      TEST_DATABASE_URL: mysql://ncg:ncg_password@127.0.0.1:3306/ncg_pharmacy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run typecheck -w server
      - run: npm test -w server

  deploy:
    # Only a push to main (or a manual run of main) reaches production.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, api]
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the deploy settings
        # Fails with a clear list instead of a cryptic SSH error when setup is incomplete.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER SITE_URL DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Actions variables/secrets:$missing (see docs/DEPLOY.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build shared, client and server
        run: |
          npm ci
          npm run build

      - name: Assemble the release
        # Production package.json + lockfile, client/dist, server/dist, migrations, seed images,
        # compiled @ncg/shared and deploy/activate.sh (see scripts/package.mjs).
        run: node scripts/package.mjs build/release

      - name: Install the deploy key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Check the host's Node.js
        # Before anything is uploaded, so a host that drifted from Node.js 24 keeps the running release.
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "node=\$HOME/nodevenv/$APP_DIR/$NODE_MAJOR/bin/node; echo \"Node.js \$(\$node --version)\"; \$node -e 'process.exit(Number(process.versions.node.split(\".\")[0]) >= $NODE_MAJOR ? 0 : 1)'"

      - name: Upload the release
        # .env, node_modules (CloudLinux venv link), tmp and logs live on the host and are never touched.
        run: |
          rsync -az --delete \
            --exclude=/.env --exclude=/node_modules --exclude=/tmp --exclude=/stderr.log \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_PORT -o StrictHostKeyChecking=yes" \
            build/release/ "$DEPLOY_USER@$DEPLOY_HOST:$APP_DIR/"

      - name: Install dependencies, migrate, and restart
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash $APP_DIR/deploy/activate.sh $NODE_MAJOR"

      - name: Check the site answers
        # /api/health is 200 only when the app is up AND the database answers.
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/api/health" || true)
            echo "attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && break
            [ "$attempt" = "6" ] && exit 1
            sleep 10
          done

      - name: Check every surface over TLS
        run: |
          expect() {
            status=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL$2")
            echo "$2: HTTP $status (want $1)"
            [ "$status" = "$1" ]
          }
          expect 200 /
          expect 200 /cart
          expect 200 /admin/products
          expect 200 /api/products
          # Unknown API routes answer with JSON 404, not the React app.
          expect 404 /api/does-not-exist
          product=$(curl -s "$SITE_URL/api/products" | jq -r '.[0].id // empty')
          if [ -n "$product" ]; then
            expect 200 "/products/$product"
            expect 200 "/api/products/$product"
          else
            echo "no products yet: product pages not checked (run db:seed once)"
          fi
          image=$(curl -s "$SITE_URL/api/products" | jq -r '[.[].images[]?.url][0] // empty')
          if [ -n "$image" ]; then expect 200 "$image"; else echo "no product images: media not checked"; fi

      - name: Remove the deploy key
        if: always()
        run: rm -f ~/.ssh/deploy_key
